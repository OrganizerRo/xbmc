name: Build Kodi Core (Leia Windows Split)

on:
  push:
    branches: [Leia]
  pull_request:
    branches: [Leia]
  workflow_dispatch:
    inputs:
      trigger_addons:
        description: "Trigger addons workflow after core build"
        required: false
        default: "true"
      addons_workflow_file:
        description: "Addons workflow filename (e.g. build-addons.yml)"
        required: false
        default: "build-addons.yml"
      core_run_id:
        description: "Optional override run ID (defaults to this run)"
        required: false

permissions:
  contents: read
  actions: write   # REQUIRED to trigger another workflow

jobs:
  build-kodi-core:
    name: Build Kodi Core (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 120

    # ✅ Fix: allow manual runs + Leia branch logic
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'Leia' ||
      github.base_ref == 'Leia'

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MinGW-built libraries
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: |
            lib/win32/ffmpeg
            lib/libdvd
          key: mingw-libs-leia-windows-2022-${{ hashFiles('tools/buildsteps/windows/make-mingwlibs.sh', 'tools/buildsteps/windows/buildffmpeg.sh', 'tools/buildsteps/windows/buildlibdvd.sh') }}

      - name: Add MSYS2 to PATH
        shell: cmd
        run: |
          echo C:\msys64\usr\bin>>%GITHUB_PATH%
          echo C:\msys64\bin>>%GITHUB_PATH%

      - name: Create MSYS2 junctions
        shell: cmd
        run: |
          if not exist C:\msys64\xbmc mklink /j C:\msys64\xbmc %GITHUB_WORKSPACE%
          if not exist %GITHUB_WORKSPACE%\project\BuildDependencies\msys64 mklink /j %GITHUB_WORKSPACE%\project\BuildDependencies\msys64 C:\msys64

      - name: Write MSYS2 fstab mounts
        shell: pwsh
        run: |
          $fstabPath = "C:\msys64\etc\fstab"
          New-Item -ItemType Directory -Force -Path (Split-Path $fstabPath) | Out-Null
          "C:/msys64 /usr ext2 binary,posix=0,noacl,user 0 0" | Out-File -FilePath $fstabPath -Encoding ascii
          "C:/msys64/mingw32 /mingw ext2 binary,posix=0,noacl,user 0 0" | Add-Content -Path $fstabPath -Encoding ascii
          "C:/msys64/xbmc /xbmc ext2 binary,posix=0,noacl,user 0 0" | Add-Content -Path $fstabPath -Encoding ascii

      - name: Download build dependencies (pre-FFmpeg)
        shell: cmd
        working-directory: project\BuildDependencies
        run: DownloadBuildDeps.bat

      - name: Update MSYS2 package database
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: cmd
        run: bash -lc "pacman --needed --noconfirm -Sy"

      - name: Install MinGW32 build tools
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: cmd
        run: >
          bash -lc "pacman --needed --noconfirm -S
          base-devel
          autoconf
          automake
          libtool
          git
          wget
          mingw-w64-i686-gcc
          mingw-w64-i686-binutils
          mingw-w64-i686-pkg-config
          mingw-w64-i686-gnutls
          mingw-w64-i686-yasm"

      - name: Set up MinGW32 build environment
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          if not exist C:\msys64\build mkdir C:\msys64\build
          if not exist C:\msys64\local32\etc mkdir C:\msys64\local32\etc
          bash -c "printf 'export BITS=32bit\nexport LOCALBUILDDIR=/build\nexport LOCALDESTDIR=/local32\nexport MINGW_PREFIX=/mingw32\nexport MINGW_CHOST=i686-w64-mingw32\nexport PKG_CONFIG_PATH=/local32/lib/pkgconfig:/mingw32/lib/pkgconfig\n' > /local32/etc/profile.local"

      - name: Build FFmpeg and libDVD from source
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        timeout-minutes: 60
        shell: cmd
        env:
          MSYSTEM: MINGW32
        run: >
          bash --login -e
          /xbmc/tools/buildsteps/windows/make-mingwlibs.sh
          --prompt=noprompt
          --mode=clean
          --build32=yes
          --build64=no

      - name: Validate MinGW build outputs
        shell: pwsh
        run: |
          $required = @(
            "lib\win32\ffmpeg\lib",
            "lib\win32\ffmpeg\include",
            "lib\libdvd\lib",
            "lib\libdvd\include"
          )
          $failed = $false
          foreach ($rel in $required) {
            $path = "$env:GITHUB_WORKSPACE\$rel"
            if (-not (Test-Path $path) -or (Get-ChildItem $path).Count -eq 0) {
              Write-Error "Missing or empty: $path"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Rename MinGW FFmpeg import libs for MSVC
        shell: pwsh
        run: |
          $libDir = "$env:GITHUB_WORKSPACE\lib\win32\ffmpeg\lib"
          if (Test-Path $libDir) {
            $files = Get-ChildItem -Path $libDir -Filter "lib*.dll.a"
            if ($files.Count -eq 0) {
              Write-Error "No lib*.dll.a import libraries found in $libDir"
              exit 1
            }
            $files | ForEach-Object {
              $newName = $_.Name.Substring(3) -replace '\.dll\.a$', '.lib'
              Rename-Item $_.FullName (Join-Path $_.DirectoryName $newName)
            }
          }

      - name: Prepare system directory
        shell: pwsh
        run: |
          $systemDir = "$env:GITHUB_WORKSPACE\system"
          New-Item -ItemType Directory -Force $systemDir | Out-Null

      - name: Configure with CMake
        shell: cmd
        working-directory: project\cmake
        run: cmake -G "Visual Studio 17 2022" -A Win32 .

      - name: Build core only
        shell: cmd
        working-directory: project\cmake
        run: cmake --build . --target ALL_BUILD --config RelWithDebInfo --parallel

      - name: Upload core SDK artifact for addons
        uses: actions/upload-artifact@v4
        with:
          name: kodi-sdk-leia-windows
          path: kodi-sdk-leia-windows/
          if-no-files-found: error

      # ✅ NEW: Trigger addons workflow and pass run ID
      - name: Trigger Addons Workflow
        if: ${{ github.event.inputs.trigger_addons == 'true' || github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ github.event.inputs.core_run_id || github.run_id }}
          echo "Triggering addons workflow with run ID: $RUN_ID"

          gh api repos/${{ github.repository }}/actions/workflows/${{ github.event.inputs.addons_workflow_file }}/dispatches \
            -f ref=Leia \
            -f inputs[core_run_id]=$RUN_ID
